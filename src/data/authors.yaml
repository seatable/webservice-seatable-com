# Blog authors, referenced by the `author` key in a post's front matter.
# A post whose author has no entry here (or no name) gets no byline,
# no author box and "SeaTable" as Organization in the structured data.
#
# image:  path below /static, e.g. /img/authors/<key>.jpg, square (min. 200x200).
#         Without an image, the initials are shown.
# sameAs: profile URLs (LinkedIn, GitHub, ...), used for structured data
#         and the profile link in the author box.
# role / bio: per language, missing languages fall back to "en".

cdb:
    name: 'Christoph Dyllick-Brenzinger'
    image: '/img/authors/cdb.jpg'
    sameAs: []
    role:
        de: 'Mitgründer und Geschäftsführer der SeaTable GmbH'
        en: 'Co-founder and Managing Director of SeaTable GmbH'
    bio:
        de: 'Christoph hat die SeaTable GmbH 2020 zusammen mit seinem Bruder Ralf gegründet und verantwortet Produkt und Marketing. Er beschäftigt sich seit Jahren mit No-Code-Datenbanken und berät Unternehmen und Behörden beim Umstieg von Excel und Airtable.'
        en: 'Christoph co-founded SeaTable GmbH with his brother Ralf in 2020 and is responsible for product and marketing. He has worked with no-code databases for years and advises companies and public authorities on moving away from Excel and Airtable.'

rdb:
    name: 'Dr. Ralf Dyllick-Brenzinger'
    image: '/img/authors/rdb.jpg'
    sameAs: []
    role:
        de: 'Mitgründer und Geschäftsführer der SeaTable GmbH'
        en: 'Co-founder and Managing Director of SeaTable GmbH'
    bio:
        de: 'Ralf hat die SeaTable GmbH 2020 zusammen mit seinem Bruder Christoph gegründet und verantwortet Vertrieb, Finanzen und die Betreuung der Kunden.'
        en: 'Ralf co-founded SeaTable GmbH with his brother Christoph in 2020 and is responsible for sales, finance and customer relations.'
